services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres_dev
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_dev"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
